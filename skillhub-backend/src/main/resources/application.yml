spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skillhub
    username: ${DB_USERNAME:skillhub}
    password: ${DB_PASSWORD:skillhub}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080

skillhub:
  jwt:
    secret: ${JWT_SECRET:skillhub-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    club.skillhub: INFO
    org.springframework.security: WARN
